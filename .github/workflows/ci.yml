name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Backend: lint, test, coverage gate (90%, see .coveragerc)
  # ---------------------------------------------------------------------
  backend:
    name: Backend - lint, test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Also fails if a test has no @tc(...) documentation (test/conftest.py).
      - name: Test with coverage gate
        run: pytest --cov=backend --cov-report=xml --cov-report=term-missing:skip-covered

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  # ---------------------------------------------------------------------
  # Frontend: lint, test, coverage gate, build
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend - lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Coverage thresholds are in frontend/vitest.config.js. Also fails if a test has no tc(...) documentation.
      - name: Unit tests with coverage gate
        run: npx vitest run --coverage

      - name: Build (catches production build errors)
        run: npm run build

  # ---------------------------------------------------------------------
  # Security: secret scanning + dependency auditing (runs in parallel)
  # ---------------------------------------------------------------------
  security:
    name: Security - secrets & dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/test-register/package-lock.json

      - name: Node dependency audit (npm audit)
        run: |
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=high
          npm ci --prefix docs/test-register
          npm audit --prefix docs/test-register --audit-level=high

  # ---------------------------------------------------------------------
  # Test register: rebuild the Word document from the test results.
  # Also fails on a duplicate or malformed test case ID.
  # ---------------------------------------------------------------------
  register:
    name: Test register - build unit test cases document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/test-register/package-lock.json

      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: docs/test-register

      - name: Build docs/Unit-Test-Cases.docx
        run: docs/test-register/build.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-cases
          path: docs/Unit-Test-Cases.docx
