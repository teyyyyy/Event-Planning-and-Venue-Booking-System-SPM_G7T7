name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/test-register/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: docs/test-register
      # Runs both suites and the coverage gates, then builds the Word register from the results.
      - run: scripts/test-all.sh --register
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-cases
          path: docs/Unit-Test-Cases.docx
